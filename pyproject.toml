[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "brci"
version = "4.24.0"
description = "BRCI (Brick Rigs Creation Interface) is a library that allows you to create and edit creation files in the game Brick Rigs."
readme = "README.md"
requires-python = ">=3.12.0"
license = { file = "LICENSE" }
keywords = ["brci", "bricks", "brick rigs", "creation", "interface", "vehicles"]
authors = [
    { name = "MrPerruche" },
    { name = "FateUnix29" },
]
maintainers = [
    { name = "MrPerruche" },
    { name = "FateUnix29" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy >= 2.0",
]